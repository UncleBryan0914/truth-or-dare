<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>真心話大冒險</title>
  <style>
    :root {
      --truth: #2563eb;
      --truth-dark: #1d4ed8;
      --dare: #dc2626;
      --dare-dark: #b91c1c;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --card-w: min(160px, 28vw);
      --card-h: calc(var(--card-w) * 1.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(ellipse at top, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
    }

    header {
      text-align: center;
      padding: 1.25rem 1rem 0.5rem;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.05em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
      padding: 0.75rem 1rem 1rem;
    }

    .toolbar button {
      font: inherit;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      padding: 0.55rem 1.1rem;
    }

    .btn-new {
      background: #f59e0b;
      color: #1c1917;
      font-weight: 600;
    }

    .btn-new:hover { filter: brightness(1.08); }

    .arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(0.75rem, 3vw, 2rem);
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem 1.5rem;
    }

    @media (max-width: 640px) {
      .arena { grid-template-columns: 1fr; }
    }

    .pile {
      background: rgba(30, 41, 59, 0.75);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .deck-wrap {
      position: relative;
      width: var(--card-w);
      height: calc(var(--card-h) + 24px);
      margin-bottom: 0.5rem;
    }

    .pile-remaining {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
    }

    .pile-remaining strong {
      font-size: 1.15em;
      font-weight: 700;
    }

    .pile.truth .pile-remaining strong { color: #93c5fd; }
    .pile.dare .pile-remaining strong { color: #fca5a5; }

    .pile-remaining.empty { opacity: 0.5; }

    .deck {
      position: absolute;
      inset: 0;
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .deck:nth-child(1) { transform: translate(0, 0); z-index: 5; }
    .deck:nth-child(2) { transform: translate(4px, 4px); z-index: 4; opacity: 0.92; }
    .deck:nth-child(3) { transform: translate(8px, 8px); z-index: 3; opacity: 0.84; }

    .deck.face.truth {
      background-color: var(--truth);
      background-image: image-set(
        url('./images/cards/truth-card-preview@1x.png') 1x,
        url('./images/cards/truth-card-preview.png') 2x
      );
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: transparent;
      font-size: 0;
    }

    .deck.face.dare {
      background-color: var(--dare);
      background-image: image-set(
        url('./images/cards/dare-card-draft@1x.png') 1x,
        url('./images/cards/dare-card-draft.png') 2x
      );
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: transparent;
      font-size: 0;
    }

    .deck:not(.disabled):hover {
      transform: translate(-2px, -4px) !important;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      z-index: 10 !important;
    }

    .deck.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    .result-panel {
      max-width: 720px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
      min-height: 120px;
    }

    .card-reveal {
      background: var(--panel);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      border-left: 6px solid var(--truth);
      animation: pop 0.35s ease;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .card-reveal.dare { border-left-color: var(--dare); }

    .card-reveal .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
      opacity: 0.85;
    }

    .card-reveal p {
      margin: 0;
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      line-height: 1.55;
    }

    .history {
      max-width: 720px;
      margin: 0 auto 2.5rem;
      padding: 0 1rem;
    }

    .history h3 {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }

    .history ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 180px;
      overflow-y: auto;
    }

    .history li {
      font-size: 0.88rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      color: var(--muted);
    }

    .history li span { color: var(--text); }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 1.1rem;
    }

    .loading-overlay.hidden { display: none; }

    .error-banner {
      max-width: 720px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      background: #7f1d1d;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .error-banner.visible { display: block; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">載入卡牌中…</div>

  <header>
    <h1>真心話大冒險</h1>
  </header>

  <div class="toolbar">
    <button type="button" class="btn-new" id="btnNewGame">開啟新局</button>
  </div>

  <div id="errorBanner" class="error-banner" role="alert"></div>

  <main class="arena">
    <section class="pile truth" aria-label="真心話牌堆">
      <div class="deck-wrap" id="truthDeckVisual">
        <div class="deck face truth" data-type="truth" aria-label="真心話牌堆">TRUTH</div>
        <div class="deck face truth" aria-hidden="true"></div>
        <div class="deck face truth" aria-hidden="true"></div>
      </div>
      <p class="pile-remaining" id="pileRemainingTruth">
        真心話 <strong id="countTruth">0</strong> 張
      </p>
    </section>

    <section class="pile dare" aria-label="大冒險牌堆">
      <div class="deck-wrap" id="dareDeckVisual">
        <div class="deck face dare" data-type="dare" aria-label="大冒險牌堆">DARE</div>
        <div class="deck face dare" aria-hidden="true"></div>
        <div class="deck face dare" aria-hidden="true"></div>
      </div>
      <p class="pile-remaining" id="pileRemainingDare">
        大冒險 <strong id="countDare">0</strong> 張
      </p>
    </section>
  </main>

  <section class="result-panel" id="resultPanel" aria-live="polite"></section>

  <section class="history">
    <h3>本局紀錄</h3>
    <ul id="historyList"></ul>
  </section>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
