<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>真心話大冒險</title>
  <style>
    :root {
      --truth: #2563eb;
      --truth-dark: #1d4ed8;
      --dare: #dc2626;
      --dare-dark: #b91c1c;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --card-w: min(160px, 28vw);
      --card-h: calc(var(--card-w) * 1.45);
      /* 牌堆視覺寬度（含堆疊右移 8px，與 .deck:nth-child(3) 一致） */
      --pile-visual-w: calc(var(--card-w) + 8px);
      --toolbar-control-h: 2.3rem;
      --deck-wrap-extra: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(ellipse at top, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
    }

    header {
      text-align: center;
      padding: 1.25rem 1rem 0.5rem;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.05em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
      align-items: center;
      padding: 0.75rem 1rem 0.65rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .toolbar__primary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
      align-items: center;
    }

    .toolbar button {
      font: inherit;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      padding: 0.55rem 1.1rem;
      line-height: 1.2;
    }

    .btn-new {
      background: #f59e0b;
      color: #1c1917;
      font-weight: 600;
    }

    .btn-new:hover { filter: brightness(1.08); }

    .btn-temp-manage {
      background: var(--panel);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-weight: 600;
    }

    .btn-temp-manage:hover { filter: brightness(1.08); }

    .btn-history-mobile {
      display: none;
    }

    .cross-deck-mode {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem 0.55rem;
      margin: 0;
      padding: 0 0.45rem;
      height: var(--toolbar-control-h);
      box-sizing: border-box;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      flex-shrink: 0;
    }

    .cross-deck-mode__label {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .cross-deck-mode__group {
      display: flex;
      height: calc(var(--toolbar-control-h) - 4px);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.5);
    }

    .cross-deck-mode__btn {
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0 0.5rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .cross-deck-mode__btn:not(:last-child) {
      border-right: 1px solid rgba(148, 163, 184, 0.25);
    }

    .cross-deck-mode__btn:hover:not(.is-active) {
      color: var(--text);
      background: rgba(148, 163, 184, 0.1);
    }

    .cross-deck-mode__btn.is-active {
      background: #f59e0b;
      color: #1c1917;
    }

    .cross-deck-mode__help {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.05rem;
      height: 1.05rem;
      border-radius: 50%;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 700;
      cursor: help;
      padding: 0;
      flex-shrink: 0;
    }

    .cross-deck-mode__help:hover,
    .cross-deck-mode__help:focus-visible {
      color: var(--text);
      border-color: rgba(148, 163, 184, 0.6);
      outline: none;
    }

    .cross-deck-mode__tooltip {
      position: absolute;
      bottom: calc(100% + 0.45rem);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(280px, calc(100vw - 1.5rem));
      padding: 0.55rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text);
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      z-index: 30;
      text-align: left;
      white-space: normal;
    }

    .cross-deck-mode__help:hover .cross-deck-mode__tooltip,
    .cross-deck-mode__help:focus-visible .cross-deck-mode__tooltip,
    .cross-deck-mode__tooltip.is-open {
      opacity: 1;
      visibility: visible;
    }

    .card-reveal .cross-deck-banner {
      margin: 0 0 0.75rem;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.04em;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 210;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 1.5rem);
      background: rgba(15, 23, 42, 0.94);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease-out, visibility 0.18s ease-out;
    }

    .modal-overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-overlay.hidden { display: none; }

    .modal-sheet {
      width: min(92vw, 400px);
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
      border-radius: 1rem;
      padding: 1.25rem 1.25rem 1rem;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.5);
      transform: translateY(12px) scale(0.97);
      opacity: 0;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
    }

    .modal-overlay.is-open .modal-sheet {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-sheet--editor {
      width: min(94vw, 520px);
      max-height: min(85vh, 640px);
      display: flex;
      flex-direction: column;
    }

    .modal-sheet h2 {
      margin: 0 0 1rem;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      text-align: center;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .modal-actions button {
      font: inherit;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .modal-pick-truth { background: var(--truth); color: #fff; }
    .modal-pick-dare { background: var(--dare); color: #fff; }
    .modal-btn-muted {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.3);
      font-weight: 500;
    }

    .temp-editor-body {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 0.75rem;
      -webkit-overflow-scrolling: touch;
    }

  #tempEditorRows {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .temp-editor-row {
      display: flex;
      gap: 0.45rem;
      align-items: center;
    }

    .temp-row-input {
      flex: 1;
      font: inherit;
      font-size: 1rem;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
    }

    .temp-row-input:focus {
      outline: 2px solid rgba(148, 163, 184, 0.5);
      outline-offset: 1px;
    }

    .temp-row-remove {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border: none;
      border-radius: 8px;
      background: rgba(127, 29, 29, 0.35);
      color: #fca5a5;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .temp-row-remove:hover { background: rgba(127, 29, 29, 0.55); }

    .btn-add-row {
      width: 100%;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border-radius: 8px;
      border: 1px dashed rgba(148, 163, 184, 0.45);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .btn-add-row:hover { color: var(--text); border-color: var(--muted); }

    .btn-temp-done {
      width: 100%;
      font: inherit;
      font-weight: 700;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: #1c1917;
      cursor: pointer;
    }

    .btn-temp-done:hover { filter: brightness(1.08); }


    .arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(0.75rem, 3vw, 2rem);
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem 1.5rem;
    }

    @media (min-width: 641px) {
      .toolbar {
        flex-wrap: nowrap;
      }

      .toolbar button.btn-new,
      .toolbar button.btn-temp-manage {
        height: var(--toolbar-control-h);
        padding: 0 1.1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        height: 100dvh;
        overflow: hidden;
      }

      .app-frame {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        width: 100%;
        max-width: 100%;
        padding: 0 1rem;
        box-sizing: border-box;
      }

      header {
        padding: 0.65rem 0 0.25rem;
        flex-shrink: 0;
      }

      header h1 {
        font-size: 1.2rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        padding: 0.45rem 0 0.5rem;
        flex-shrink: 0;
        width: 100%;
        max-width: none;
        margin: 0;
      }

      .toolbar__primary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.4rem;
        width: 100%;
      }

      .toolbar__primary button {
        padding: 0.55rem 0.35rem;
        font-size: 0.72rem;
        line-height: 1.2;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .btn-history-mobile {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .cross-deck-mode {
        width: 100%;
        max-width: none;
        height: auto;
        min-height: unset;
        border-radius: 1rem;
        padding: 0.55rem 0.75rem;
        justify-content: space-between;
        gap: 0.4rem;
      }

      .cross-deck-mode__label {
        font-size: 0.8rem;
      }

      .cross-deck-mode__group {
        flex: 1;
        height: 1.75rem;
        justify-content: stretch;
      }

      .cross-deck-mode__btn {
        flex: 1;
        padding: 0.45rem 0.35rem;
        font-size: 0.8rem;
      }

      .cross-deck-mode__help {
        width: 1.25rem;
        height: 1.25rem;
        font-size: 0.72rem;
      }

      .error-banner {
        flex-shrink: 0;
        margin: 0 0 0.35rem;
        max-width: none;
      }

      .arena {
        flex: 1;
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 0.5rem;
        padding: 0.35rem 0 0.5rem;
        overflow: hidden;
        width: 100%;
        max-width: none;
        margin: -3px 0 0;
      }

      .pile {
        padding: 0.55rem;
        width: 100%;
      }

      .deck-wrap {
        margin-bottom: 0.2rem;
      }

      .history--desktop {
        display: none;
      }
    }

    .pile {
      background: rgba(30, 41, 59, 0.75);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .deck-wrap {
      position: relative;
      width: var(--pile-visual-w);
      height: calc(var(--card-h) + var(--deck-wrap-extra));
      margin-bottom: 0.35rem;
    }

    .pile-remaining {
      margin: 0;
      width: var(--pile-visual-w);
      max-width: 100%;
      box-sizing: border-box;
      padding: 0.2rem 0;
      font-size: clamp(0.82rem, 2.8vw, 0.95rem);
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .pile-remaining strong {
      font-size: 1.15em;
      font-weight: 700;
    }

    .pile.truth .pile-remaining strong { color: #93c5fd; }
    .pile.dare .pile-remaining strong { color: #fca5a5; }

    .pile-remaining.empty { opacity: 0.5; }

    .deck {
      position: absolute;
      inset: 0;
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .deck:nth-child(1) { transform: translate(0, 0); z-index: 5; }
    .deck:nth-child(2) { transform: translate(4px, 4px); z-index: 4; opacity: 0.92; }
    .deck:nth-child(3) { transform: translate(8px, 8px); z-index: 3; opacity: 0.84; }

    .deck.face.truth {
      background-color: var(--truth);
      background-image: image-set(
        url('./images/cards/truth-card-preview@1x.png') 1x,
        url('./images/cards/truth-card-preview.png') 2x
      );
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: transparent;
      font-size: 0;
    }

    .deck.face.dare {
      background-color: var(--dare);
      background-image: image-set(
        url('./images/cards/dare-card-draft@1x.png') 1x,
        url('./images/cards/dare-card-draft.png') 2x
      );
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: transparent;
      font-size: 0;
    }

    .deck:not(.disabled):hover {
      transform: translate(-2px, -4px) !important;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      z-index: 10 !important;
    }

    .deck.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    /* 牌堆抽完：底部顯示灰階空卡（無圖、無字） */
    .deck-empty {
      position: absolute;
      inset: 0;
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 12px;
      border: 2px solid rgba(148, 163, 184, 0.28);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      background: linear-gradient(155deg, #94a3b8 0%, #64748b 48%, #475569 100%);
      background-image: none;
      transform: translate(8px, 8px);
      z-index: 3;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      cursor: default;
      filter: grayscale(1);
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .deck-wrap.is-empty .deck.face {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .deck-wrap.is-empty .deck-empty {
      opacity: 0.92;
      visibility: visible;
    }

    .reveal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2rem);
      cursor: pointer;
      background: rgba(15, 23, 42, 0.94);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease-out, visibility 0.18s ease-out;
      -webkit-tap-highlight-color: transparent;
    }

    .reveal-overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .reveal-overlay.hidden {
      display: none;
    }

    .reveal-overlay__panel {
      position: relative;
      width: min(92vw, 540px);
      max-height: min(72vh, 520px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(10px) scale(0.97);
      opacity: 0;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
    }

    .reveal-overlay.is-open .reveal-overlay__panel {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .reveal-overlay__hint {
      margin: 1rem 0 0;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      color: var(--muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-out 0.05s;
    }

    .reveal-overlay.is-open .reveal-overlay__hint {
      opacity: 1;
    }

    .card-reveal {
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
      border-radius: 1.25rem;
      padding: clamp(1.5rem, 5vw, 2.25rem) clamp(1.25rem, 4vw, 2rem);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 6px solid var(--truth);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
      text-align: center;
      cursor: pointer;
    }

    .card-reveal.dare { border-top-color: var(--dare); }

    .card-reveal .tag {
      display: inline-block;
      font-size: clamp(0.7rem, 2.2vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      margin-bottom: 0.85rem;
      opacity: 0.9;
      color: #93c5fd;
    }

    .card-reveal.dare .tag { color: #fca5a5; }

    .card-reveal p {
      margin: 0;
      font-size: clamp(1.2rem, 4.8vw, 1.85rem);
      line-height: 1.5;
      font-weight: 500;
    }

    .history {
      max-width: 720px;
      margin: 0 auto 2.5rem;
      padding: 0 1rem;
    }

    .history h3 {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }

    .history-list,
    .history-popup-body ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .history--desktop .history-list {
      max-height: 180px;
      overflow-y: auto;
    }

    .history-list li,
    .history-popup-body li {
      font-size: 0.88rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      color: var(--muted);
    }

    .history-list li span,
    .history-popup-body li span {
      color: var(--text);
    }

    .modal-sheet--history {
      width: min(92vw, 400px);
      max-height: min(72vh, 520px);
      display: flex;
      flex-direction: column;
    }

    .history-popup-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin-bottom: 0.65rem;
      -webkit-overflow-scrolling: touch;
    }

    .history-popup-close {
      width: 100%;
      border-radius: 10px;
      padding: 0.7rem 1rem;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 1.1rem;
    }

    .loading-overlay.hidden { display: none; }

    .error-banner {
      max-width: 720px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      background: #7f1d1d;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .error-banner.visible { display: block; }

    @keyframes revealFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes revealPop {
      from { opacity: 0; transform: scale(0.82); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">載入卡牌中…</div>

  <div class="app-frame" id="appFrame">
  <header>
    <h1>真心話大冒險</h1>
  </header>

  <div class="toolbar">
    <div class="toolbar__primary">
      <button type="button" class="btn-new" id="btnNewGame">開啟新局</button>
      <button type="button" class="btn-temp-manage" id="btnManageTemp">管理臨時新增題目</button>
      <button type="button" class="btn-temp-manage btn-history-mobile" id="historyBar" aria-haspopup="dialog" aria-controls="historyOverlay">局內紀錄</button>
    </div>
    <div class="cross-deck-mode" role="group" aria-label="遊玩模式設定">
      <span class="cross-deck-mode__label">遊玩模式</span>
      <div class="cross-deck-mode__group">
        <button type="button" class="cross-deck-mode__btn is-active" data-mode="peace" aria-pressed="true">和平</button>
        <button type="button" class="cross-deck-mode__btn" data-mode="icebreaker" aria-pressed="false">破冰</button>
        <button type="button" class="cross-deck-mode__btn" data-mode="drunk" aria-pressed="false">喝醉</button>
      </div>
      <button type="button" class="cross-deck-mode__help" id="btnPlayModeHelp" aria-label="遊玩模式說明" aria-expanded="false" tabindex="0">
        ?
        <span class="cross-deck-mode__tooltip" id="playModeTooltip" role="tooltip">
          抽到隔壁牌堆的機率：<br />
          和平 0%｜破冰 20%｜喝醉 50%
        </span>
      </button>
    </div>
  </div>

  <div id="errorBanner" class="error-banner" role="alert"></div>

  <main class="arena">
    <section class="pile truth" aria-label="真心話牌堆">
      <div class="deck-wrap" id="truthDeckVisual">
        <div class="deck face truth" data-type="truth" aria-label="真心話牌堆">TRUTH</div>
        <div class="deck face truth" aria-hidden="true"></div>
        <div class="deck face truth" aria-hidden="true"></div>
        <div class="deck deck-empty" aria-hidden="true" aria-label="真心話牌堆已空"></div>
      </div>
      <p class="pile-remaining" id="pileRemainingTruth">
        真心話 <strong id="countTruth">0</strong> 張
      </p>
    </section>

    <section class="pile dare" aria-label="大冒險牌堆">
      <div class="deck-wrap" id="dareDeckVisual">
        <div class="deck face dare" data-type="dare" aria-label="大冒險牌堆">DARE</div>
        <div class="deck face dare" aria-hidden="true"></div>
        <div class="deck face dare" aria-hidden="true"></div>
        <div class="deck deck-empty" aria-hidden="true" aria-label="大冒險牌堆已空"></div>
      </div>
      <p class="pile-remaining" id="pileRemainingDare">
        大冒險 <strong id="countDare">0</strong> 張
      </p>
    </section>
  </main>
  </div>

  <div class="modal-overlay hidden" id="tempMenuOverlay" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <div class="modal-sheet" role="document">
      <h2>臨時新增題目</h2>
      <div class="modal-actions">
        <button type="button" class="modal-pick-truth" data-pick="truth">管理真心話</button>
        <button type="button" class="modal-pick-dare" data-pick="dare">管理大冒險</button>
        <button type="button" class="modal-btn-muted" id="tempMenuCancel">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="tempEditorOverlay" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <div class="modal-sheet modal-sheet--editor" role="document">
      <h2 id="tempEditorTitle">新增的真心話題目</h2>
      <div class="temp-editor-body">
        <div id="tempEditorRows"></div>
      </div>
      <button type="button" class="btn-add-row" id="btnAddTempRow">+</button>
      <button type="button" class="btn-temp-done" id="btnTempDone">完成編輯</button>
    </div>
  </div>

  <div class="reveal-overlay hidden" id="revealOverlay" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <div class="reveal-overlay__panel" id="resultPanel" aria-live="polite"></div>
    <p class="reveal-overlay__hint">點一下任意處關閉</p>
  </div>

  <div class="modal-overlay hidden" id="historyOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyPopupTitle" hidden>
    <div class="modal-sheet modal-sheet--history" role="document">
      <h2 id="historyPopupTitle">局內紀錄</h2>
      <div class="history-popup-body">
        <ul id="historyListPopup" class="history-list"></ul>
      </div>
      <button type="button" class="modal-btn-muted history-popup-close" id="historyClose">關閉</button>
    </div>
  </div>

  <section class="history history--desktop">
    <h3>本局紀錄</h3>
    <ul id="historyList" class="history-list"></ul>
  </section>

  <script src="./config.js"></script>
  <script src="./temp-cards.js"></script>
  <script src="./app.js"></script>
</body>
</html>
